; Upload limits matching the original app: reference images 10MB,
; catalog/story images 20MB, showcase/story videos 50MB.
; Production needs the same values in its php.ini (and nginx
; client_max_body_size >= 64m).
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 256M
max_execution_time = 120
